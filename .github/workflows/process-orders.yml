name: Moss & Marrow — Order Processor

on:
  schedule:
    # Runs every 30 minutes around the clock.
    # The Python script enforces working hours — runs outside those hours
    # ingest new orders but do not deliver until the next working window.
    - cron: '*/30 * * * *'

  # Allow a manual trigger from the Actions tab (useful for testing)
  workflow_dispatch:

jobs:
  process-orders:
    name: Process Orders
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit state.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run order processor
        env:
          # ── FINAL SAFETY: claims this run for Moss & Marrow. The processor
          #    exits immediately if this is missing, so this duplicate can
          #    never act on Sworn & Sealed. Do not add this variable to the
          #    Sworn & Sealed workflow. ──────────────────────────────────────
          SHOP_BRAND: moss-and-marrow

          # ── Timezone (set as a Repository Variable, not a Secret) ──────────
          TIMEZONE: ${{ vars.TIMEZONE }}

          # ── Etsy (this shop's own API app + tokens, NOT Sworn & Sealed's) ──
          ETSY_API_KEY:       ${{ secrets.ETSY_API_KEY }}
          ETSY_SHOP_ID:       ${{ secrets.ETSY_SHOP_ID }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}

          # ── Google (service account with access to the intake sheet) ───────
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID:          ${{ secrets.GOOGLE_CALENDAR_ID }}

          # ── Claude (Anthropic) ─────────────────────────────────────────────
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}

          # ── Gmail (the Moss & Marrow sending address) ──────────────────────
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

          # ── Optional: audio deliverable for the flagship tier ──────────────
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

        run: python process_orders.py

      - name: Commit updated state
        run: |
          git config user.name  "Willow [Moss & Marrow Automation]"
          git config user.email "automation@moss-marrow.local"
          git add state.json
          # Only commit if state.json actually changed
          git diff --staged --quiet || git commit -m "chore: update order state [skip ci]"
          git push
